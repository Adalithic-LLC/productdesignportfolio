          <div class="mix-pop" id="mixPop" role="dialog" aria-label="Volumes" hidden>

            <label class="mix-row" id="mixVoiceRow">Voice <input type="range" id="voiceVol" min="0" max="150" step="5" value="100" /><output id="voiceVolOut">100%</output></label>

        <button class="ib" id="mute" aria-pressed="false" title="Mute (M)" aria-label="Mute"><svg viewBox="0 0 16 16" id="muteIcon"></svg></button>
        <label class="pick" id="ovWrap" hidden title="Overlay: see what each app's own interface covers"><svg class="pk-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 14 5.2 8 8.4 2 5.2z"/><path d="M2 8.4 8 11.6l6-3.2"/><path d="M2 11.4 8 14.6l6-3.2"/></svg><select id="overlay" aria-label="Overlay"><option value="">Off</option><option value="safe" title="Safe zones">Safe</option><option value="instagram" title="Instagram Reels">Reels</option><option value="tiktok">TikTok</option><option value="youtube" title="YouTube Shorts">Shorts</option></select></label>
        <button class="ib" id="phoneBtn" aria-pressed="false" title="Phone frame: see the cut on an iPhone screen" aria-label="Phone frame"><svg viewBox="0 0 16 16"><path d="M4.5 0.5h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2zM4.5 2v12h7V2zM6.5 2.6h3v1h-3z" fill-rule="evenodd"/></svg></button>
        <button class="ib" id="dl" hidden title="Download this cut" aria-label="Download"><svg viewBox="0 0 16 16"><path d="M7 1.5h2v7.1l2.6-2.6L13 7.4 8 12.4 3 7.4 4.4 6 7 8.6z"/><path d="M2 13.2h12v1.8H2z"/></svg></button>
        <button class="ib" id="fs" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 16 16" id="fsIcon"><path d="M2 2h5v2H4v3H2zM9 2h5v5h-2V4H9zM2 9h2v3h3v2H2zM12 9h2v5H9v-2h3z"/></svg></button>
      </div>
    </div>
    </div>

    <div class="timeline">
      <div class="tl-head">
        <span class="tl-name">Timeline</span>
        <div class="tl-mini" id="tlMini" role="slider" tabindex="0" aria-label="Playhead" aria-valuemin="0"><div class="tl-mini-track"><i id="tlMiniFill"></i></div><b id="tlMiniKnob"></b></div>
        <button class="ib tl-fold" id="tlFold" type="button" aria-expanded="true" aria-label="Collapse the timeline" title="Collapse the timeline"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 5.6 8 10.3l4.7-4.7 1.1 1.1L8 12.5 2.2 6.7z"/></svg></button>

      <div class="tl-body">
        <div class="tl-labels"><div class="l-ruler">Time</div><div class="l-scenes">Scenes</div><div class="l-retime">Retime</div><div class="l-marks">Changes</div></div>

          <div class="tl-inner" id="tlInner">
            <div class="row r-ruler" id="ruler"></div>

  </section>

        </div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
  // Media a version doc points at is either an uploaded asset (an id, served
  // at /_blob/<id>) or a file published with this page (a relative path such
  // as vo/v25/kore-cut.mp4), used once the asset store is full.
  function mediaUrl(ref) { return /[/.]/.test(ref) ? ref : '/_blob/' + ref; }

(() => {
  const $ = (id) => document.getElementById(id);
  const v = $('v');
  const FPS = 60;
  const state = {
    versions: [], ver: null, comments: [], timing: {}, cur: -1,
    zoom: 1, rate: 1, loop: false, preview: false, out: null,
    cState: 'open', cScope: 'all', hot: null, canWrite: null, me: null,
  };
  let db = null, unsubTiming = null;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, val) { try { localStorage.setItem(k, val); } catch {} },
  };

  // ---------- formatting ----------
  const fmt = (t) => {
    t = Math.max(0, t || 0);
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    return `${m}:${s.toFixed(2).padStart(5, '0')}`;
  };
  const secs = (x) => `${x.toFixed(2).replace(/0$/, '')}s`;
  const signed = (x) => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(2).replace(/0$/, '') + 's';
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // ---------- version helpers ----------
  const scenes = () => (state.ver && state.ver.scenes) || [];
  const duration = () => (state.ver && state.ver.duration) || v.duration || 0;
  const sceneAt = (t) => { const s = scenes(); for (let i = s.length - 1; i >= 0; i--) if (t >= s[i].start - 1e-6) return i; return 0; };
  const proposed = (sc) => { const p = state.timing[sc.id]; return p && Number.isFinite(p.duration) ? p.duration : null; };
  const lenOf = (sc) => sc.end - sc.start;

  // ---------- live status ----------
  function setLive(kind, text) { const l = $('live'); if (!l) return; l.className = 'live ' + kind; l.lastElementChild.textContent = text; }

  // ---------- timeline geometry ----------
  let pps = 10; // pixels per second
  function totalSpan() {
    const s = scenes();
    const retimed = s.reduce((a, sc) => a + (proposed(sc) ?? lenOf(sc)), 0);
    return Math.max(duration(), retimed, 1);
  }
  function layout() {
    const w = $('tlScroll').clientWidth;
    const d = totalSpan();
    pps = (w * state.zoom - 2) / d;
    $('tlInner').style.width = Math.max(w, d * pps) + 'px';
    drawRuler(); drawScenes(); drawRetime(); drawMarks(); drawPlayhead(); drawInpoint();
  }
  function drawRuler() {
    const r = $('ruler'); r.textContent = '';
    const d = totalSpan();
    const minor = pps > 60 ? 0.5 : 1;
    const major = pps > 30 ? 5 : pps > 12 ? 10 : 15;
    for (let t = 0; t <= d + 1e-6; t += minor) {
      const isMajor = Math.abs(t / major - Math.round(t / major)) < 1e-6;
      if (!isMajor && pps < 6) continue;
      const k = el('div', 'tick' + (isMajor ? ' major' : ''));
      k.style.left = t * pps + 'px';
      if (isMajor) k.appendChild(el('span', null, fmt(t).replace(/\.00$/, '')));
      r.appendChild(k);
    }
  }
  function drawScenes() {
    const row = $('scenesRow'); row.textContent = '';
    scenes().forEach((sc, i) => {
      const b = el('div', 'scene ' + (i % 2 ? 'b' : 'a') + (i === state.cur ? ' cur' : ''));
      b.style.left = sc.start * pps + 1 + 'px';
      b.style.width = Math.max(2, lenOf(sc) * pps - 2) + 'px';
      b.title = `${sc.name}\n${fmt(sc.start)} – ${fmt(sc.end)} (${secs(lenOf(sc))})`;
      b.dataset.i = i;
      b.appendChild(el('b', null, `${i + 1} · ${secs(lenOf(sc))}`));
      b.appendChild(document.createTextNode(sc.name.replace(/^\d+\.\s*/, '')));
      row.appendChild(b);
    });
  }
  function drawRetime() {
    const row = $('retimeRow'); row.textContent = '';
    let x = 0;
    scenes().forEach((sc, i) => {
      const p = proposed(sc);
      const len = p ?? lenOf(sc);
      const g = el('div', 'ghost' + (p != null && Math.abs(p - lenOf(sc)) > 1e-3 ? ' changed' : ''));
      g.style.left = x * pps + 1 + 'px';
      g.style.width = Math.max(2, len * pps - 2) + 'px';
      g.title = `${sc.name}\nNow ${secs(lenOf(sc))}` + (p != null ? ` → proposed ${secs(p)}` : '');
      const delta = p != null ? p - lenOf(sc) : 0;
      const lbl = el('div', 'lbl');
      lbl.appendChild(el('span', 'd', p != null && Math.abs(delta) > 1e-3 ? signed(delta) : secs(len)));
      lbl.appendChild(document.createTextNode(sc.name));
      g.appendChild(lbl);
      const h = el('div', 'handle');
      h.dataset.i = i;
      h.title = 'Drag to change this scene’s length';
      g.appendChild(h);
      row.appendChild(g);
      x += len;
    });
  }
  function visibleComments() {
    return state.comments.filter((c) => state.ver && c.version === state.ver.id);
  }
  function drawMarks() {
    const row = $('marksRow'); row.textContent = '';
    visibleComments().forEach((c) => {
      const range = Number.isFinite(c.tEnd) && c.tEnd > c.t;
      const m = el('button', 'mark' + (range ? ' range' : '') + (c.resolved ? ' done' : '') + (state.hot === c.id ? ' hot' : ''));
      m.style.left = c.t * pps + 'px';
      if (range) m.style.width = Math.max(18, (c.tEnd - c.t) * pps) + 'px';
      m.title = `${fmt(c.t)}${range ? ' – ' + fmt(c.tEnd) : ''}\n${c.text}`;
      m.setAttribute('aria-label', `Change at ${fmt(c.t)}: ${c.text}`);
      m.addEventListener('pointerdown', (e) => e.stopPropagation());
      m.addEventListener('click', () => focusComment(c.id, true));
      row.appendChild(m);
    });
  }
  function drawPlayhead() { $('playhead').style.left = v.currentTime * pps + 'px'; }
  function drawInpoint() {
    const ip = $('inpoint');
    if (state.out == null) { ip.hidden = true; return; }
    const a = Math.min(state.inAt, state.out), b = Math.max(state.inAt, state.out);
    ip.hidden = false; ip.style.left = a * pps + 'px'; ip.style.width = (b - a) * pps + 'px';
  }

  // ---------- scrubbing ----------
  function timeFromX(clientX) {
    const r = $('tlInner').getBoundingClientRect();
    return Math.min(Math.max(0, (clientX - r.left) / pps), duration());
  }
  function seek(t) {
    if (state.freeze) { state.freeze = null; aud.pause(); }
    if (!state.ver) return;
    v.currentTime = Math.min(Math.max(0, t), Math.max(0, duration() - 1 / FPS));
    tick(true);
  }
  ['ruler', 'scenesRow', 'marksRow'].forEach((id) => {
    $(id).addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const target = e.currentTarget;
      target.setPointerCapture(e.pointerId);
      const wasPlaying = !v.paused; v.pause();
      seek(timeFromX(e.clientX));
      const move = (ev) => seek(timeFromX(ev.clientX));
      const up = () => { target.removeEventListener('pointermove', move); target.removeEventListener('pointerup', up); target.removeEventListener('pointercancel', up); if (wasPlaying) v.play(); };
      target.addEventListener('pointermove', move);
      target.addEventListener('pointerup', up);
      target.addEventListener('pointercancel', up);
    });
  });

  // ---------- the folded timeline ----------
  // The fold button hides the scene, retime and change rows and leaves one
  // scrub bar with a draggable playhead. Remembered per browser.
  function setFold(on) {
    const tl = document.querySelector('.timeline');
    tl.classList.toggle('folded', on);
    const label = on ? 'Expand the timeline' : 'Collapse the timeline';
    $('tlFold').setAttribute('aria-expanded', String(!on));
    $('tlFold').setAttribute('aria-label', label);
    $('tlFold').title = label;
    store.set('cutroom.tlFolded', on ? '1' : '');
    if (!on) layout();
  }
  $('tlFold').onclick = () => setFold(!document.querySelector('.timeline').classList.contains('folded'));
  setFold(store.get('cutroom.tlFolded') === '1');
  {
    const mini = $('tlMini');
    const tAt = (x) => { const r = mini.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)) * duration(); };
    mini.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      mini.setPointerCapture(e.pointerId); mini.classList.add('drag');
      const wasPlaying = !v.paused; v.pause();
      seek(tAt(e.clientX));
      const move = (ev) => seek(tAt(ev.clientX));
      const up = () => {
        mini.classList.remove('drag');
        mini.removeEventListener('pointermove', move); mini.removeEventListener('pointerup', up); mini.removeEventListener('pointercancel', up);
        if (wasPlaying) v.play();
      };
      mini.addEventListener('pointermove', move); mini.addEventListener('pointerup', up); mini.addEventListener('pointercancel', up);
    });
    mini.addEventListener('keydown', (e) => {
      const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!step) return;
      e.preventDefault(); e.stopPropagation();
      seek(v.currentTime + step * (e.shiftKey ? 5 : 1));
    });
    const drawMini = () => {
      const d = duration(), k = d ? Math.min(1, v.currentTime / d) : 0;
      $('tlMiniFill').style.width = k * 100 + '%';
      $('tlMiniKnob').style.left = k * 100 + '%';
      mini.setAttribute('aria-valuemax', d.toFixed(1));
      mini.setAttribute('aria-valuenow', v.currentTime.toFixed(1));
      mini.setAttribute('aria-valuetext', fmt(v.currentTime));
      requestAnimationFrame(drawMini);
    };
    drawMini();
  }

  // ---------- retime dragging ----------
  $('retimeRow').addEventListener('pointerdown', (e) => {
    const h = e.target.closest('.handle');
    if (!h) { // clicking a retime block seeks to that scene's start in the current cut
      const g = e.target.closest('.ghost');
      if (g) { const i = [...$('retimeRow').children].indexOf(g); if (scenes()[i]) seek(scenes()[i].start + 1e-3); }
      return;
    }
    if (!canEditTiming()) return;
    e.preventDefault();
    const i = +h.dataset.i;
    const sc = scenes()[i];
    const ghost = h.parentElement;
    const left = ghost.getBoundingClientRect().left;
    h.classList.add('drag'); h.setPointerCapture(e.pointerId);
    const tip = $('tip'); tip.hidden = false;
    let len = proposed(sc) ?? lenOf(sc);
    const move = (ev) => {
      len = Math.max(0.1, Math.round(((ev.clientX - left) / pps) * 20) / 20);
      ghost.style.width = Math.max(2, len * pps - 2) + 'px';
      const d = len - lenOf(sc);
      tip.textContent = `${secs(len)} (${signed(d)})`;
      tip.style.left = ev.clientX + 'px'; tip.style.top = ghost.getBoundingClientRect().top + 'px';
    };
    move(e);
    const up = () => {
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      tip.hidden = true; h.classList.remove('drag');
      setProposal(sc.id, Math.abs(len - lenOf(sc)) < 1e-3 ? null : len);
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });

  // ---------- transport ----------
  function setPlayIcon() {
    const playing = !v.paused || !!state.freeze;
    $('playIcon').innerHTML = !playing ? '<path d="M4 2l10 6-10 6z"/>' : '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
    $('play').setAttribute('aria-label', !playing ? 'Play' : 'Pause');
  }
  const togglePlay = () => { if (!state.ver) return; if (state.freeze) { state.freeze = null; aud.pause(); setPlayIcon(); return; } if (v.paused) { if (v.currentTime >= duration() - 0.02) v.currentTime = 0; v.play(); } else v.pause(); };
  const step = (dt) => { v.pause(); seek(Math.round((v.currentTime + dt) * FPS) / FPS); };
  const toScene = (dir) => {
    const s = scenes(); if (!s.length) return;
    let i = sceneAt(v.currentTime);
    if (dir < 0 && v.currentTime - s[i].start > 0.35) { seek(s[i].start + 1e-3); return; }
    i = Math.min(Math.max(0, i + dir), s.length - 1);
    seek(s[i].start + 1e-3);
  };
  $('play').onclick = togglePlay;
  $('backF').onclick = () => step(-1 / FPS);
  $('fwdF').onclick = () => step(1 / FPS);
  $('back1').onclick = () => step(-1);
  $('fwd1').onclick = () => step(1);
  $('prevScene').onclick = () => toScene(-1);
  $('nextScene').onclick = () => toScene(1);
  v.addEventListener('play', setPlayIcon);
  v.addEventListener('pause', setPlayIcon);
  v.addEventListener('ended', setPlayIcon);
  v.addEventListener('loadedmetadata', () => { layout(); tick(true); });
  v.addEventListener('error', () => { $('empty').hidden = false; $('empty').textContent = 'This cut’s video didn’t load. Reload the page, or ask Claude to re-upload it.'; });

  function segPick(id, attr, onPick) {
    $(id).addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      [...$(id).children].forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      onPick(b.dataset[attr]);
    });
  }
  $('speed').onchange = (e) => { state.rate = +e.target.value; applyRate(); };
  segPick('cState', 's', (s) => { state.cState = s; renderComments(); });
  segPick('cScope', 'v', (s) => { state.cScope = s; renderComments(); });
  // The speaker button mutes the music only: muted, the preview and every
  // download leave the music out (the UI sounds, and a voice, stay).
  function setMuteIcon() {
    const m = !state.musicOn;
    $('muteIcon').innerHTML = m
      ? '<path d="M2 6h3l4-3.5v11L5 10H2zM11 5.6l1.1-1.1L13.5 6l1.4-1.5L16 5.6 14.6 7 16 8.4l-1.1 1.1-1.4-1.4-1.4 1.4L11 8.4 12.4 7z"/>'
      : '<path d="M2 6h3l4-3.5v11L5 10H2zM11 5.2a3.5 3.5 0 0 1 0 5.6l-.9-1.2a2 2 0 0 0 0-3.2zM12.6 3a6.3 6.3 0 0 1 0 10l-.9-1.2a4.8 4.8 0 0 0 0-7.6z"/>';
    $('mute').setAttribute('aria-pressed', m);
    $('mute').setAttribute('aria-label', m ? 'Unmute music' : 'Mute music');
    $('musicWrap').classList.toggle('off', m);

  function bgCss(mode, c, tall) {
    // Square cells: a 7.5%-wide cell is 7.5 × (w/h)% tall.
    const cw = 7.5, ch = tall ? 7.5 * 9 / 16 : 7.5 * 16 / 9;
    const cell = `${cw}% ${ch}%`;
    switch (mode) {
      case 'solid': return { background: c };
      case 'g-midnight': return { background: 'linear-gradient(180deg, #0d1330 0%, #070a18 55%, #030409 100%)' };
      case 'g-aurora': return { background: 'radial-gradient(90% 60% at 15% 10%, rgba(51,112,255,.55), transparent 60%), radial-gradient(80% 60% at 90% 85%, rgba(140,80,255,.45), transparent 60%), radial-gradient(70% 50% at 70% 30%, rgba(40,200,190,.25), transparent 60%), #05060c' };
      case 'g-sunset': return { background: 'linear-gradient(165deg, #1d0b33 0%, #5b1f4a 45%, #b0434a 75%, #e2864a 100%)' };
      case 'g-ocean': return { background: 'linear-gradient(180deg, #031923 0%, #063646 50%, #0b5d6e 100%)' };
      case 'g-tint': return { background: `linear-gradient(180deg, ${rgba(c, 0.55)} 0%, ${rgba(c, 0.12)} 55%, #05060a 100%), #05060a` };
      case 'grid': return { background: `linear-gradient(${rgba(c, 0.22)} 1px, transparent 1px) 0 0 / ${cell}, linear-gradient(90deg, ${rgba(c, 0.22)} 1px, transparent 1px) 0 0 / ${cell}, radial-gradient(70% 55% at 50% 45%, ${rgba(c, 0.18)}, transparent 70%), #06070b` };
      case 'dots': return { background: `radial-gradient(circle, ${rgba(c, 0.5)} 1.3px, transparent 1.8px) 0 0 / ${cell}, radial-gradient(70% 55% at 50% 45%, ${rgba(c, 0.16)}, transparent 70%), #06070b` };
      case 'blueprint': return { background: `linear-gradient(rgba(255,255,255,.22) 1px, transparent 1px) 0 0 / ${cw * 4}% ${ch * 4}%, linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px) 0 0 / ${cw * 4}% ${ch * 4}%, linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px) 0 0 / ${cell}, linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px) 0 0 / ${cell}, #0c2f66` };
      case 'lines': return { background: `repeating-linear-gradient(180deg, transparent 0 calc(${ch}% - 1px), ${rgba(c, 0.2)} calc(${ch}% - 1px) ${ch}%), #07080c` };
      case 'spotlight': return { background: `radial-gradient(55% 40% at 50% 42%, ${rgba(c, 0.45)}, ${rgba(c, 0.08)} 55%, transparent 75%), #030407` };
      case 'mesh': return { background: `radial-gradient(60% 45% at 20% 25%, ${rgba(c, 0.5)}, transparent 70%), radial-gradient(55% 45% at 85% 70%, ${rgba(c, 0.32)}, transparent 70%), radial-gradient(50% 40% at 40% 95%, rgba(255,255,255,.06), transparent 70%), #07080d` };
      case 'grain': return { background: `${GRAIN}, radial-gradient(80% 60% at 50% 40%, ${rgba(c, 0.25)}, transparent 70%), #0a0b10` };
    }
    return null;
  }
  state.bg = store.get('cutroom.bg') || '';
  state.bgColor = store.get('cutroom.bgColor') || '#3370ff';
  $('bgColor').value = state.bgColor;
  function usingAlpha() { return !!(state.bg && state.ver && state.ver.alphaAssetId); }
  function loadVideo(t, keepPlaying) {
    const x = state.ver; if (!x) return;
    const src = mediaUrl(usingAlpha() ? x.alphaAssetId : x.assetId);
    if (v.getAttribute('src') === src) return;
    const wasPlaying = keepPlaying && !v.paused;
    v.src = src; v.load();
    v.addEventListener('loadedmetadata', () => { v.currentTime = Math.min(t, (x.duration || 1) - 0.05); if (wasPlaying) v.play().catch(() => {}); }, { once: true });
  }
  function applyBackground() {
    const x = state.ver;
    const can = !!(x && x.alphaAssetId);
    $('bgWrap').hidden = !can;
    $('bgSel').value = state.bg;
    $('bgColor').hidden = !state.bg || ['g-midnight', 'g-aurora', 'g-sunset', 'g-ocean', 'blueprint'].includes(state.bg);
    $('bgAdd').disabled = !state.bg || !db || state.canWrite === false;
    const on = can && !!state.bg;
    const css = on ? bgCss(state.bg, state.bgColor, x.aspect === '9:16') : null;
    const layer = $('bgl');
    layer.hidden = !css;
    layer.style.background = css ? css.background : '';
    $('screen').classList.toggle('has-bg', !!css);
    if (x && x.assetId) loadVideo(v.currentTime, true);
    applyAudio();
  }
  $('bgSel').onchange = () => { state.bg = $('bgSel').value; store.set('cutroom.bg', state.bg); applyBackground(); updateDl(); };
  $('bgColor').oninput = () => { state.bgColor = $('bgColor').value; store.set('cutroom.bgColor', state.bgColor); applyBackground(); };
  $('bgAdd').onclick = async () => {
    if (!state.bg || !db || !state.ver) return;
    const tinted = !$('bgColor').hidden;
    const label = BG_LABEL[state.bg] + (tinted ? ` (${state.bgColor})` : '');
    const s = scenes(); const i = s.length ? sceneAt(state.inAt) : -1;
    $('bgAdd').disabled = true;
    try {
      await db.collection('comments').add({
        version: state.ver.id, t: +state.inAt.toFixed(3), tEnd: null,
        scene: i >= 0 ? s[i].id : null, sceneName: i >= 0 ? s[i].name : null,
        kind: 'background', bg: { mode: state.bg, color: tinted ? state.bgColor : null },
        text: `Background: use ${label} for the whole film`,
        resolved: false, createdAt: Date.now(), author: state.me || null,
      });
      tab('c');
    } catch (err) { readOnly(err); } finally { applyBackground(); }
  };

  function selectVersion(id) {
    const x = state.versions.find((y) => y.id === id) || state.versions[0];
    if (!x) return;
    const same = state.ver && state.ver.id === x.id;
    state.ver = x;
    store.set('cutroom.slot', x.slot || '');
    renderVersions();
    const tall = x.aspect === '9:16';
    $('screen').classList.toggle('tall', tall);
    applyOverlay();
    $('dur').textContent = '/ ' + fmt(x.duration);
    if (!same) {
      const t = v.getAttribute('src') ? v.currentTime : (window.__CUTROOM_START || 0);
      state.cur = -1; state.out = null; state.pinned = false; state.hot = null;
      $('empty').hidden = true;
      if (x.assetId) loadVideo(t, false);
      subscribeTiming(x.id);
    }
    applyBackground();
    layout(); renderComments(); renderTiming(); updateAt(); renderMusic();
  }
  function subscribeTiming(vid) {
    if (unsubTiming) unsubTiming();
    state.timing = {};
    if (!db) return;
    unsubTiming = db.doc('timing/' + vid).onSnapshot((snap) => {
      if (snap.metadata.hasPendingWrites || timingPending) return;
      const d = snap.exists ? snap.data() : null;
      const next = (d && d.scenes) ? JSON.parse(JSON.stringify(d.scenes)) : {};
      // Our own save coming back changes nothing; skip the rebuild, which would
      // replace the field being typed in. Someone else's change waits until
      // focus leaves the list.
      const same = stableJson(next) === stableJson(state.timing);
      state.timing = next;
      if (same) return;
      if ($('tlist').contains(document.activeElement)) { state.timingStale = true; return; }
      layout(); renderTiming();
    }, () => {});
  }

  function applyWriteState() {
    const ro = state.canWrite === false || !db;
    $('ctext').disabled = ro; $('addBtn').disabled = ro;
    $('roNote').hidden = !ro;
    if (ro) $('roNote').textContent = db ? 'You can watch this cut, but your access is view-only, so changes and timing can’t be saved.' : 'Changes and timing are saved when this page is opened while signed in to claude.ai.';
    renderComments(); renderTiming();
  }

  // ---------- boot ----------
  window.addEventListener('resize', () => layout());
  new ResizeObserver(() => layout()).observe($('tlScroll'));
  setPlayIcon();
  layout();
  requestAnimationFrame(loop);

  (async () => {
    const claude = window.claude;
    const [dbNs, user, cm, dls] = await Promise.all([
      claude ? claude.use('db') : null,
      claude ? claude.use('user') : null,
      claude ? claude.use('comments') : null,
      claude ? claude.use('downloads') : null,
    ]);
    db = dbNs; comments = cm; dlNs = dls; updateDl();
    if (user) {
      try { state.me = await user.id(); } catch {}
      try { state.canWrite = await user.can('data.write'); } catch {}
    }
    if (!db) {
      setLive('off', 'Offline');
      $('empty').textContent = 'Open this page in claude.ai, signed in, to load the cuts.';
      applyWriteState();
      return;
    }
    setLive('on', 'Demo');
    applyWriteState();
    db.collection('versions').orderBy('createdAt', 'desc').onSnapshot((snap) => {
      state.versions = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      showProject();
    }, (err) => setLive('off', 'Disconnected — reload'));
    db.collection('projects').onSnapshot((snap) => {
      state.projects = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderProjects();
    }, () => {});
    db.collection('comments').onSnapshot((snap) => {
      state.comments = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderComments(); drawMarks();
      if (!$('tlist').contains(document.activeElement)) renderTiming();
    }, () => setLive('off', 'Disconnected — reload'));
  })();
})();
</script>

<style>
/* Portfolio layer (tools/cut-room/build.mjs). */
.tl-name { margin-right: auto; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.timeline.folded .tl-name { display: none; }
@media (min-width: 1021px) { .side { max-height: calc(var(--win-h, 100vh) - 28px); } }
</style>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const tl = document.querySelector('.timeline');
  const root = document.documentElement;
  const EMBED = new URLSearchParams(location.search).has('embed');

  // On its own page, the player shrinks until the controls and the timeline
  // fit in the window. Measured, not assumed: the page is zoomed, and the
  // timeline is taller open than folded (its fold button is the Cut Room's own).
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;height:100px;width:1px;top:0;left:0';
  document.body.appendChild(probe);
  let fitQueued = false;
  const fit = () => {
    fitQueued = false;
    if (EMBED) return;
    const scr = $('screen');
    if (!scr || !tl) return;
    const k = probe.getBoundingClientRect().height / 100 || 1;
    const r = scr.getBoundingClientRect(), b = tl.getBoundingClientRect();
    const other = b.bottom + window.scrollY - r.height;
    // What sits under the timeline: the body's bottom padding and the root's.
    const under = (parseFloat(getComputedStyle(document.body).paddingBottom || '0') + parseFloat(getComputedStyle(root).paddingBottom || '0') + 1) * k;
    const want = Math.round(Math.max(300, Math.min(900, (window.innerHeight - under - other) / k)));
    // The side panel's cap is 100vh, which the zoom would inflate past the window.
    root.style.setProperty('--win-h', Math.floor(window.innerHeight / k) + 'px');
    const cur = parseFloat(root.style.getPropertyValue('--tall-h')) || 0;
    if (Math.abs(want - cur) < 2) return;
    root.style.setProperty('--tall-h', want + 'px');
    root.style.setProperty('--fit-h', want + 'px');
  };
  const queueFit = () => { if (!fitQueued) { fitQueued = true; requestAnimationFrame(fit); } };
  window.addEventListener('resize', queueFit);
  new ResizeObserver(queueFit).observe(document.querySelector('.stage') || document.body);
  new MutationObserver(queueFit).observe($('screen'), { attributes: true, attributeFilter: ['class'] });

  queueFit();
})();
</script>
